name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/twiddler-trainer]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. Let a running deployment finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js _site/
          cp dist/twiddler-trainer.html _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
